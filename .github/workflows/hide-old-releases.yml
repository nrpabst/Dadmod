name: Hide old dadmod releases (one-off)
# Setup.bat from 0.10.0 and older only finds an update when GitHub lists ONE release
# (PowerShell 5.1 JSON bug). Noah approved 2026-11-22: turn every release except the newest into a draft.
# Tags and zips stay; a draft can be published again any time.
on:
  push:
    branches: [claude/project-thread-g16a7w]
permissions:
  contents: write
jobs:
  hide:
    runs-on: ubuntu-latest
    steps:
      - name: Draft older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          keep=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          echo "keeping $keep"
          [ "$keep" = "v0.10.1" ] || { echo "latest is $keep, expected v0.10.1; stopping"; exit 1; }
          for t in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,isDraft --jq '.[] | select(.isDraft|not) | .tagName'); do
            [ "$t" = "$keep" ] || { echo "drafting $t"; gh release edit "$t" --repo "$GITHUB_REPOSITORY" --draft=true; }
          done
          ok=0
          for i in 1 2 3 4 5 6; do
            tags=$(curl -s "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" | jq -r 'if type=="array" then [.[].tag_name] | join(" ") else "ERR" end')
            echo "public releases (no token): $tags"
            [ "$tags" = "$keep" ] && { ok=1; break; }
            sleep 20
          done
          [ "$ok" = "1" ]
